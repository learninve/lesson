<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>

@font-face{font-family:Rubik;font-weight:700;src:url(assets/rubik-latin-700-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}

html,body{margin:0}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Rubik,'Noto Color Emoji',sans-serif;color:#fff;background:#222 url(assets/cover_bg.png) 0 0/1080px 1920px}
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse 80% 55% at 50% 50%,rgba(0,0,0,.5),rgba(0,0,0,.4) 60%,rgba(0,0,0,.2) 100%)}
/* central 1080x1080 square: y 420..1500 */
.sq{position:absolute;left:0;top:420px;width:1080px;height:1080px}
.c{position:absolute;left:90px;width:900px;text-align:center}
.kicker{top:30px}.kicker span{display:inline-block;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.25);padding:10px 40px 13px;border-radius:16px;font-weight:700;font-size:48px}
.title{top:140px;font-weight:800;font-size:140px;line-height:1.05;white-space:nowrap;text-shadow:0 5px 0 rgba(0,0,0,.5),0 10px 40px rgba(0,0,0,.6)}
.title .y{color:#ffd84d}
.sub{top:468px;font-weight:700;font-size:48px;line-height:1.3;text-shadow:0 3px 16px rgba(0,0,0,.8)}
.logo{top:600px}.logo img{width:230px;height:230px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.6))}
.brand{top:860px;font-weight:800;font-size:56px;text-shadow:0 3px 14px rgba(0,0,0,.8)}
.phone{top:950px}.phone span{display:inline-block;direction:ltr;background:#fff;color:#14210f;border-radius:60px;padding:8px 44px 12px;font-weight:800;font-size:60px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.phone b{font-family:'Noto Color Emoji';font-size:.85em;margin-right:10px}

 <div class="c kicker"><span>שפכטל אמריקאי</span></div>
